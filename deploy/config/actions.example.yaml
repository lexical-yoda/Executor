# Example actions. Copy to actions.yaml and edit.
# actions.yaml is git-ignored and read only by the runner container.
#
# A step is exactly one of:
#   run           an argument list, never a shell string. `cwd` must be inside
#                 STACKS_DIR, which the runner mounts read-only at the same path
#                 as on the host.
#   wait_healthy  a container name; waits until Docker reports it healthy.
#   ssh           a named command on an ssh target below. The target's key
#                 should be locked to a dispatcher with a forced command, so
#                 the key can do nothing else (see README, "SSH steps").
#   http          an API call. ${NAME} in the url and header values is filled
#                 from the runner's environment and never logged.
# Steps run in order and stop at the first failure. `retry_every: <seconds>`
# repeats a failing run, ssh or http step until its timeout, to wait for
# something. `show_streams: true` lists active media streams in the confirm
# dialog (needs the jellyfin integration in config.yaml).

# Hosts for ssh steps. The key and known_hosts default to /ssh/id_ed25519 and
# /ssh/known_hosts, mounted from $EXECUTOR_DIR/ssh.
ssh:
  vps:
    host: 10.8.0.1
    user: executor

# Folders whose file names, sizes and times the runner may report to the
# backups panel, for backups that write to folders only root can read. Paths
# are inside /watch (WATCH_DIR in .env). `tail` names files whose last lines
# may be reported. The runner never reads any other file.
files:
  - id: db-dumps
    path: /watch/db-dumps
  - id: config-pull
    path: /watch/config-pull
    tail: [history.log, last-error.txt]

actions:
  - id: reset-download-stack
    title: Reset download stack
    description: >-
      Full down and up of the VPN download stack, then a restart of Sonarr and
      Radarr once the VPN and the download client both report healthy.
    confirm: >-
      The download clients and indexers go offline for about a minute while
      the stack is recreated.
    danger: medium            # low | medium | high: colours the button
    steps:
      - name: Stop the stack
        run: [docker, compose, down]
        cwd: /srv/stacks/downloads
        timeout: 180
      - name: Start the stack
        run: [docker, compose, up, --detach]
        cwd: /srv/stacks/downloads
        timeout: 420
      - name: Wait for the VPN to be healthy
        wait_healthy: gluetun
        timeout: 300
      - name: Wait for qBittorrent to be healthy
        wait_healthy: qbittorrent
        timeout: 300
      - name: Restart Sonarr and Radarr
        run: [docker, restart, sonarr, radarr]
        timeout: 120

  - id: restart-jellyfin
    title: Restart Jellyfin
    description: Restart the Jellyfin container and wait until it is healthy.
    confirm: Everyone watching loses playback for about a minute.
    danger: medium
    show_streams: true
    steps:
      - name: Restart Jellyfin
        run: [docker, restart, jellyfin]
        timeout: 120
      - name: Wait for Jellyfin to be healthy
        wait_healthy: jellyfin
        timeout: 300

  - id: scan-libraries
    title: Scan media libraries
    description: Start a Jellyfin scan of every library.
    confirm: The scan runs inside Jellyfin; playback is not interrupted.
    danger: low
    steps:
      - name: Start the library scan
        http:
          url: http://host.docker.internal:8096/Library/Refresh
          headers:
            Authorization: 'MediaBrowser Token="${JELLYFIN_API_KEY}"'
          expect: [204]
        timeout: 30

  - id: vps-nginx-reload
    title: Reload nginx on the VPS
    description: Test the VPS's nginx configuration, then reload it.
    confirm: Open connections finish on the old configuration.
    danger: low
    steps:
      - name: Test and reload nginx
        ssh: {target: vps, command: nginx-reload}
        timeout: 60
