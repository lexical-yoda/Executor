# Example Executor configuration. Copy to config.yaml and edit.
# config.yaml is git-ignored: it describes your network, so keep it private.
# Read by the web container. No secrets belong in this file.
#
# The addresses below are placeholders:
#   10.8.0.0/24     a WireGuard network, hub at 10.8.0.1
#   192.168.0.0/24  the home LAN
#   10.8.0.10       the Docker host Executor runs on

security:
  # Only these clients can open the dashboard. Everything else gets 403.
  allowed_clients:
    - 10.8.0.2/32      # laptop
    - 10.8.0.3/32      # phone
  # Always refused, even if inside an allowed network. List the WireGuard hub
  # (it faces the internet) and the LAN (guests, IoT devices).
  denied_clients:
    - 10.8.0.1/32
    - 192.168.0.0/24
  # Host header values accepted, without the port. Use the address you type
  # into the browser.
  allowed_hosts:
    - 10.8.0.10

site:
  title: Executor
  subtitle: Command deck

settings:
  check_interval: 20      # seconds between service probes
  ping_interval: 15       # seconds between machine pings
  container_interval: 10  # seconds between container state reads
  stats_interval: 15      # seconds between Beszel reads

# Optional. Machine stats and history from a Beszel hub. Log in with a Beszel
# user that has the "readonly" role; its credentials go in .env as
# BESZEL_EMAIL and BESZEL_PASSWORD, never in this file. Set SHARE_ALL_SYSTEMS
# on the hub, or add that user to each system.
integrations:
  beszel:
    url: http://host.docker.internal:8090
  # Optional. Edge panel: certificate expiry for these hosts, and VPS bandwidth
  # from a JSON file produced on the VPS (see README, "Edge panel").
  edge:
    bandwidth_url: http://10.8.0.1:8099/bandwidth.json
    certificates: [media.example.com]
    interval: 300
  # Optional. Lists active streams in the confirm dialog of actions marked
  # show_streams. The API key comes from JELLYFIN_API_KEY in .env.
  jellyfin:
    url: http://host.docker.internal:8096
    # Location history: who connected from where, kept this many days in
    # EXECUTOR_WEB_DATA (0 turns it off). Locations are looked up locally in
    # the free DB-IP Lite database; addresses are never sent anywhere.
    history_days: 90
    # On the map, streams flow from origin (the media server) to hub (a
    # public relay or reverse proxy) and out to viewers. Both optional; with
    # `machine`, the marker shows that machine's health and opens its details.
    origin: {label: Home, lat: 52.37, lon: 4.9, machine: nas}
    hub: {label: Edge server, lat: 50.11, lon: 8.68, machine: vps}
    # Ask this for the server's public address; sessions from it are placed
    # at origin (useful when the server is at home on a changing address).
    home_ip_url: https://api.ipify.org
    # Known places that beat the geolocation databases. Matched by a Jellyfin
    # device name, then by network, then by a user who is always there.
    corrections:
      - city: Amsterdam
        country: Netherlands
        country_code: NL
        lat: 52.37
        lon: 4.9
        networks: [198.51.100.0/24]
        devices: [Living Room TV]
        users: []
  # Optional. Media panels: Jellyseerr requests, Sonarr and Radarr queues, and
  # qBittorrent speeds. Keys and the qBittorrent login come from .env.
  media:
    jellyseerr:
      url: http://host.docker.internal:5055
    sonarr:
      url: http://host.docker.internal:8989
    radarr:
      url: http://host.docker.internal:7878
    qbittorrent:
      url: http://host.docker.internal:8080
  # Optional. Backups panel: Duplicati jobs (password from DUPLICATI_PASSWORD),
  # and backups judged by the files they leave in a folder the runner watches
  # (`files:` in actions.yaml). Use `expect` for a fixed set of files, or
  # `pattern` for the newest of a rotating set.
  backups:
    duplicati:
      # Use an IP address: Duplicati refuses host names that are not on its
      # allowlist (DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES), such as
      # host.docker.internal.
      url: http://192.168.0.10:8200
    files:
      - folder: db-dumps
        name: Database dumps
        schedule: Daily 02:30
        max_age_hours: 26
        expect: [app.sql, vault.sqlite3]
      - folder: config-pull
        name: VPS config pull
        schedule: Daily 02:45
        max_age_hours: 26
        pattern: "config-*.tar.gz"
        error_file: last-error.txt
        log_file: history.log
    # S3 buckets whose size and growth come from AWS's daily CloudWatch
    # storage metrics (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env, a key
    # allowed only cloudwatch:GetMetricStatistics). Without a key, the
    # Duplicati job's stored size is shown instead.
    storage:
      - name: Offsite archive
        bucket: example-backup-bucket
        region: us-east-1
        price_per_gib_month: 0.004   # Glacier Instant Retrieval list price
        duplicati_job: Offsite - weekly

# Display order of service groups. Groups not listed here follow in order of use.
groups:
  - Media
  - Downloads
  - Network & Infra
  - Public edge

# icon: server | cloud | laptop | phone | desktop | gamepad | router
# beszel: the system's name in Beszel, to show its resource stats and history.
machines:
  - id: nas
    name: NAS
    role: Storage and services
    address: 10.8.0.10
    icon: server
    beszel: NAS
    local: true          # the host Executor runs on; reports load, memory, uptime
  - id: vps
    name: VPS
    role: WireGuard hub, reverse proxy
    address: 10.8.0.1
    icon: cloud
    beszel: VPS
  - id: laptop
    name: Laptop
    role: Main laptop
    address: 10.8.0.2
    icon: laptop
  - id: phone
    name: Phone
    role: Phone
    address: 10.8.0.3
    icon: phone
  - id: desktop
    name: Desktop
    role: Gaming PC, LAN only
    address: 192.168.0.50
    icon: gamepad

# Probes run from inside the container. host.docker.internal is the Docker host.
# check.expect lists HTTP statuses that count as up; without it, anything
# below 500 counts, since a login redirect still proves the app is alive.
# containers: the first one is primary; if it is not running the service is down.
services:
  - id: jellyfin
    name: Jellyfin
    group: Media
    url: https://media.example.com
    check: { url: "http://host.docker.internal:8096/health", expect: [200] }
    containers: [jellyfin]

  - id: gluetun
    name: Gluetun VPN
    group: Downloads
    description: VPN tunnel for the download stack
    containers: [gluetun]          # no probe: container state only
  - id: sonarr
    name: Sonarr
    group: Downloads
    url: http://10.8.0.10:8989
    check: { url: "http://host.docker.internal:8989/ping", expect: [200] }
    containers: [sonarr]

  - id: nextcloud
    name: Nextcloud
    group: Network & Infra
    url: https://cloud.example.com
    check: { url: "https://host.docker.internal:443/status.php", expect: [200], verify_tls: false }
    containers: [nextcloud]
  - id: mail-bridge
    name: Mail bridge
    group: Network & Infra
    check: { type: tcp, host: host.docker.internal, port: 8025 }
    containers: [mailrise]

  - id: status-page
    name: Status page
    group: Public edge
    url: https://status.example.com
    check: { url: "https://status.example.com/" }
